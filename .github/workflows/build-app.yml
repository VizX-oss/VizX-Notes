name: Build App

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Gradle build task to execute'
        required: true
        default: 'assembleFossDebug'
        type: choice
        options:
          - 'assembleFossDebug'
          - 'assembleFossRelease'
          - 'assembleCoreDebug'
          - 'assembleGplayDebug'
          - 'bundleFossRelease'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build App with Gradle
        run: ./gradlew ${{ inputs.build_variant || 'assembleFossDebug' }} --stacktrace

      - name: Upload Build Artifacts (APKs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apk-${{ inputs.build_variant || 'assembleFossDebug' }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
